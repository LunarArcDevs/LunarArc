import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.Type
import org.objectweb.asm.tree.AbstractInsnNode
import org.objectweb.asm.tree.ClassNode
import org.objectweb.asm.tree.LdcInsnNode
import org.objectweb.asm.tree.MethodInsnNode
import org.objectweb.asm.tree.MethodNode

plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
}

static byte[] neutralizeMojangLogUtils(byte[] classBytes) {
    ClassNode classNode = new ClassNode()
    new ClassReader(classBytes).accept(classNode, 0)
    Type selfType = Type.getObjectType(classNode.name)
    boolean changed = false
    for (MethodNode method : classNode.methods) {
        for (AbstractInsnNode insn : method.instructions.toArray()) {
            if (!(insn instanceof MethodInsnNode)) continue
            MethodInsnNode call = (MethodInsnNode) insn
            boolean isTargetedLogUtilsCall = call.owner == 'com/mojang/logging/LogUtils' &&
                (call.name == 'getClassLogger' || call.name == 'getLogger') &&
                call.desc == '()Lorg/slf4j/Logger;'
            if (!isTargetedLogUtilsCall) continue

            method.instructions.insertBefore(call, new LdcInsnNode(selfType))
            call.owner = 'org/slf4j/LoggerFactory'
            call.name = 'getLogger'
            call.desc = '(Ljava/lang/Class;)Lorg/slf4j/Logger;'
            changed = true
        }
    }
    if (!changed) return classBytes
    ClassWriter writer = new ClassWriter(ClassWriter.COMPUTE_MAXS)
    classNode.accept(writer)
    return writer.toByteArray()
}

static byte[] redirectPaperOnlyNmsCalls(byte[] classBytes) {
    String support = 'io/lunararcdevs/lunararc/common/bridge/donor/DonorContainerSupport'
    Map<String, String> renamedTypes = [
        'net/minecraft/world/level/block/ChestBlock$DoubleInventory': 'io/lunararcdevs/lunararc/common/bridge/donor/DonorDoubleInventory'
    ]
    ClassNode classNode = new ClassNode()
    new ClassReader(classBytes).accept(classNode, 0)
    boolean changed = false
    for (MethodNode method : classNode.methods) {
        for (AbstractInsnNode insn : method.instructions.toArray()) {
            if (!(insn instanceof MethodInsnNode)) continue
            MethodInsnNode call = (MethodInsnNode) insn
            if (call.owner == 'net/minecraft/world/Container' && call.name == 'getOwner' &&
                    call.desc == '()Lorg/bukkit/inventory/InventoryHolder;') {
                call.setOpcode(org.objectweb.asm.Opcodes.INVOKESTATIC)
                call.owner = support
                call.name = 'ownerOf'
                call.desc = '(Lnet/minecraft/world/Container;)Lorg/bukkit/inventory/InventoryHolder;'
                call.itf = false
                changed = true
            } else if (call.owner == 'net/minecraft/world/level/block/ChestBlock' && call.name == 'getMenuProvider' &&
                    call.desc == '(Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;Z)Lnet/minecraft/world/MenuProvider;') {
                call.setOpcode(org.objectweb.asm.Opcodes.INVOKESTATIC)
                call.owner = support
                call.name = 'chestMenuProvider'
                call.desc = '(Lnet/minecraft/world/level/block/ChestBlock;Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;Z)Lnet/minecraft/world/MenuProvider;'
                call.itf = false
                changed = true
            }
        }
    }
    boolean referencesRenamed = renamedTypes.keySet().any {
        new String(classBytes, java.nio.charset.StandardCharsets.ISO_8859_1).contains(it)
    }
    if (!changed && !referencesRenamed) return classBytes
    ClassWriter writer = new ClassWriter(ClassWriter.COMPUTE_MAXS)
    classNode.accept(new org.objectweb.asm.commons.ClassRemapper(writer, new org.objectweb.asm.commons.SimpleRemapper(renamedTypes)))
    return writer.toByteArray()
}

if (project == rootProject) {
    throw new GradleException('lunararc-common must be built from the LunarArc root project. Run ./gradlew clean build collect from the directory containing settings.gradle.')
}

