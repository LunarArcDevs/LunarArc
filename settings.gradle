pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

rootProject.name = 'LunarArc'
// lunararc-api now lives at github.com/LunarArcDevs/api, pulled in via JitPack.
include 'lunararc-common'

include 'lunararc-neoforge'
include 'lunararc-forge'
include 'lunararc-fabric'
include 'lunararc-quilt'

include 'installer'
include 'i18n-config'
include 'bootstrap'
